<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bearings - fleet board</title>
<style>
/* Board design system v1 - direction A · Showcase. Paste once as the first <style> in <head>.
   pending 🟠, finalizing 🔵, blocked 🔴 mirror bin/fm-status-render.sh; on boards action is charcoal ▶ and green means success. */
@import url("https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300..800&family=Source+Code+Pro:wght@400..600&display=swap");
:root{
  color-scheme:light dark;
  --ds-font:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ds-mono:"Source Code Pro",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ds-fs-xs:.8125rem;--ds-fs-sm:.875rem;--ds-fs-base:1rem;--ds-fs-lg:1.25rem;--ds-fs-xl:1.5rem;--ds-fs-2xl:2rem;
  --ds-lh:1.55;
  --ds-s1:4px;--ds-s2:8px;--ds-s3:12px;--ds-s4:16px;--ds-s5:24px;--ds-s6:32px;--ds-s7:48px;
  --ds-width:1040px;
  --ds-r-sm:0;--ds-r:0;--ds-r-lg:0;--ds-r-pill:30px;
  --ds-bw:1px;
  --ds-h-weight:500;
  --ds-shadow:0 2px 4px 0 rgb(0 0 0/.16),0 2px 10px 0 rgb(0 0 0/.12);
  --ds-bg:#ffffff;
  --ds-surface:#ffffff;--ds-surface-2:#f5f5f5;
  --ds-border:#e3e3e3;
  --ds-text:#242323;
  --ds-muted:#666666;
  --ds-accent:#c24a07;
  --ds-on-accent:#ffffff;
  --ds-link:#b84606;
  --ds-brand:#d65108;
  --ds-on-status:#ffffff;
  --ds-action:#333333;--ds-action-soft:#ececec;--ds-action-text:#242323;
  --ds-success:#22863a;--ds-success-soft:#dff3e4;--ds-success-text:#155724;
  --ds-pending:#c25000;--ds-pending-soft:#ffe8d6;--ds-pending-text:#9c4100;
  --ds-info:#1f73af;--ds-info-soft:#e1eef7;--ds-info-text:#1a5f91;
  --ds-danger:#d42d3d;--ds-danger-soft:#f8d7da;--ds-danger-text:#721c24;
  --ds-warning:#8a6600;--ds-warning-soft:#fff3cd;--ds-warning-text:#7a5a00;
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){
  color-scheme:dark;
  --ds-bg:#282727;
  --ds-surface:#302f2f;--ds-surface-2:#242323;
  --ds-border:#3b3b3b;
  --ds-text:#fcfaf9;
  --ds-muted:#acacac;
  --ds-accent:#c24a07;
  --ds-on-accent:#ffffff;
  --ds-link:#ff8040;
  --ds-brand:#d65108;
  --ds-on-status:#1c1b1b;
  --ds-action:#e8e6e5;--ds-action-soft:#3b3a3a;--ds-action-text:#fcfaf9;
  --ds-success:#3fbf5f;--ds-success-soft:#223a29;--ds-success-text:#86e29b;
  --ds-pending:#ff8040;--ds-pending-soft:#43301f;--ds-pending-text:#ffae7a;
  --ds-info:#4a9fe0;--ds-info-soft:#1f3346;--ds-info-text:#8cc2f0;
  --ds-danger:#f2626f;--ds-danger-soft:#47262a;--ds-danger-text:#f5b9bf;
  --ds-warning:#e0b42e;--ds-warning-soft:#3d3520;--ds-warning-text:#f0d27a;
}
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ds-bg:#282727;
  --ds-surface:#302f2f;--ds-surface-2:#242323;
  --ds-border:#3b3b3b;
  --ds-text:#fcfaf9;
  --ds-muted:#acacac;
  --ds-accent:#c24a07;
  --ds-on-accent:#ffffff;
  --ds-link:#ff8040;
  --ds-brand:#d65108;
  --ds-on-status:#1c1b1b;
  --ds-action:#e8e6e5;--ds-action-soft:#3b3a3a;--ds-action-text:#fcfaf9;
  --ds-success:#3fbf5f;--ds-success-soft:#223a29;--ds-success-text:#86e29b;
  --ds-pending:#ff8040;--ds-pending-soft:#43301f;--ds-pending-text:#ffae7a;
  --ds-info:#4a9fe0;--ds-info-soft:#1f3346;--ds-info-text:#8cc2f0;
  --ds-danger:#f2626f;--ds-danger-soft:#47262a;--ds-danger-text:#f5b9bf;
  --ds-warning:#e0b42e;--ds-warning-soft:#3d3520;--ds-warning-text:#f0d27a;
}
:root[data-theme="light"]{color-scheme:light}
/* ---- components: every rule reads tokens only ---- */
*,*::before,*::after{box-sizing:border-box}
html{background:var(--ds-bg)}
body{margin:0;background:var(--ds-bg);color:var(--ds-text);font:var(--ds-fs-base)/var(--ds-lh) var(--ds-font);-webkit-font-smoothing:antialiased}
.ds-board{max-width:var(--ds-width);margin:0 auto;padding:var(--ds-s6) var(--ds-s4) var(--ds-s7)}
.ds-board :where(.ds-grid,.ds-options,.ds-row)>*{min-width:0}
:where(.ds-board) :where(p,li,td,th,dd,h1,h2,h3,h4){overflow-wrap:anywhere}
:where(.ds-board) :where(img,svg){max-width:100%;height:auto}
.ds-board h1,.ds-board h2,.ds-board h3,.ds-board h4{line-height:1.2;margin:0 0 var(--ds-s3);font-weight:var(--ds-h-weight);color:var(--ds-text)}
.ds-board h1{font-size:var(--ds-fs-2xl)}
.ds-board h2{font-size:var(--ds-fs-xl)}
.ds-board h3{font-size:var(--ds-fs-lg)}
.ds-board h4{font-size:var(--ds-fs-base)}
.ds-board p{margin:0 0 var(--ds-s3)}
.ds-board a{color:var(--ds-link);text-underline-offset:2px}
.ds-board :focus-visible{outline:3px solid var(--ds-brand);outline-offset:2px}
.ds-section{margin-top:var(--ds-s7)}
.ds-section>h2{margin-bottom:var(--ds-s2)}
.ds-lead{color:var(--ds-muted);margin:0 0 var(--ds-s5);max-width:68ch}
.ds-eyebrow{font:600 var(--ds-fs-xs)/1.2 var(--ds-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ds-muted)}
.ds-muted{color:var(--ds-muted)}
.ds-grid{display:grid;gap:var(--ds-s4);grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.ds-row{display:flex;flex-wrap:wrap;gap:var(--ds-s2);align-items:center}

/* tone: one is-* class sets the status hue for a component and its children; unset falls back to neutral */
.is-action{--ds-tone:var(--ds-action);--ds-tone-soft:var(--ds-action-soft);--ds-tone-text:var(--ds-action-text)}
.is-success,.is-done{--ds-tone:var(--ds-success);--ds-tone-soft:var(--ds-success-soft);--ds-tone-text:var(--ds-success-text)}
.is-pending{--ds-tone:var(--ds-pending);--ds-tone-soft:var(--ds-pending-soft);--ds-tone-text:var(--ds-pending-text)}
.is-finalizing,.is-info{--ds-tone:var(--ds-info);--ds-tone-soft:var(--ds-info-soft);--ds-tone-text:var(--ds-info-text)}
.is-blocked,.is-danger{--ds-tone:var(--ds-danger);--ds-tone-soft:var(--ds-danger-soft);--ds-tone-text:var(--ds-danger-text)}
.is-warning{--ds-tone:var(--ds-warning);--ds-tone-soft:var(--ds-warning-soft);--ds-tone-text:var(--ds-warning-text)}

.ds-header{background:var(--ds-accent);color:var(--ds-on-accent);border-bottom:4px solid var(--ds-brand);border-radius:var(--ds-r-lg);padding:var(--ds-s5) var(--ds-s5) var(--ds-s4)}
.ds-header h1{color:inherit;margin:var(--ds-s2) 0 var(--ds-s2)}
.ds-header p{margin:0;max-width:70ch}
.ds-header .ds-eyebrow{color:inherit}
.ds-header__meta{display:flex;flex-wrap:wrap;gap:var(--ds-s1) var(--ds-s4);margin-top:var(--ds-s4);font:var(--ds-fs-xs)/1.4 var(--ds-mono)}

.ds-verdict{display:flex;flex-wrap:wrap;gap:var(--ds-s2) var(--ds-s4);align-items:baseline;margin-top:var(--ds-s5);padding:var(--ds-s4) var(--ds-s5);background:var(--ds-tone-soft,var(--ds-surface-2));border:var(--ds-bw) solid var(--ds-tone,var(--ds-border));border-left-width:6px;border-radius:var(--ds-r-lg)}
.ds-verdict__label{font-weight:700;color:var(--ds-tone-text,var(--ds-text));white-space:nowrap}
.ds-verdict__text{flex:1 1 320px;min-width:0;font-size:var(--ds-fs-lg);line-height:1.35}

.ds-card{background:var(--ds-surface);border:var(--ds-bw) solid var(--ds-border);border-radius:var(--ds-r-lg);padding:var(--ds-s5);box-shadow:var(--ds-shadow)}
.ds-card>:last-child{margin-bottom:0}
.ds-decision{border-left:5px solid var(--ds-tone,var(--ds-border))}
.ds-decision__q{font-size:var(--ds-fs-lg);font-weight:600;margin:var(--ds-s1) 0 var(--ds-s3)}
.ds-choice{display:flex;gap:var(--ds-s3);align-items:flex-start;padding:var(--ds-s3);margin:0 0 var(--ds-s2);border:var(--ds-bw) solid var(--ds-border);border-radius:var(--ds-r);background:var(--ds-surface);cursor:pointer}
.ds-choice:hover{background:var(--ds-surface-2)}
.ds-choice:has(input:checked){border-color:var(--ds-text);box-shadow:inset 0 0 0 1px var(--ds-text)}
.ds-choice input{margin-top:.3em;accent-color:var(--ds-text)}
.ds-choice small{display:block;color:var(--ds-muted)}
.ds-rec{display:inline-block;margin-left:var(--ds-s2);padding:0 8px;border-radius:var(--ds-r-pill);font:600 var(--ds-fs-xs)/1.6 var(--ds-font);background:var(--ds-text);color:var(--ds-surface);vertical-align:1px}

.ds-options{display:grid;gap:var(--ds-s4);grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.ds-option{display:flex;flex-direction:column;gap:var(--ds-s2);background:var(--ds-surface);border:var(--ds-bw) solid var(--ds-border);border-radius:var(--ds-r-lg);padding:var(--ds-s4)}
.ds-option.is-recommended{border:2px solid var(--ds-text);box-shadow:var(--ds-shadow)}
.ds-option h3{margin:0}
.ds-option>.ds-badge{align-self:flex-start}
.ds-option ul{margin:0;padding:0;list-style:none}
.ds-option li{padding-left:1.3em;text-indent:-1.3em;margin:2px 0}
.ds-pro::before{content:"+ ";font-weight:700;color:var(--ds-success-text)}
.ds-con::before{content:"\2212  ";font-weight:700;color:var(--ds-danger-text)}

.ds-table-wrap{overflow-x:auto;background:var(--ds-surface);border:var(--ds-bw) solid var(--ds-border);border-radius:var(--ds-r-lg)}
.ds-table{width:100%;border-collapse:collapse;font-size:var(--ds-fs-sm)}
.ds-table th,.ds-table td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--ds-border)}
.ds-table th{font-size:var(--ds-fs-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ds-muted);background:var(--ds-surface-2)}
.ds-table tbody tr:last-child td{border-bottom:0}
.ds-table tbody tr:hover{background:var(--ds-surface-2)}
.ds-num{text-align:right!important;font-family:var(--ds-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.ds-steps{list-style:none;margin:0;padding:0}
.ds-step{position:relative;padding:0 0 var(--ds-s5) 34px}
.ds-step::before{content:"";position:absolute;left:4px;top:.25em;width:16px;height:16px;border-radius:50%;background:var(--ds-surface);border:3px solid var(--ds-tone,var(--ds-border))}
.ds-step::after{content:"";position:absolute;left:11px;top:calc(.25em + 18px);bottom:2px;width:2px;background:var(--ds-border)}
.ds-step:last-child{padding-bottom:0}
.ds-step:last-child::after{display:none}
.ds-step.is-done::before{background:var(--ds-tone,var(--ds-border))}
.ds-step__title{font-weight:600}
.ds-step__meta{color:var(--ds-muted);font-size:var(--ds-fs-sm)}

.ds-board code{font-family:var(--ds-mono);font-size:.9em;background:var(--ds-surface-2);padding:.1em .35em;border-radius:var(--ds-r-sm)}
.ds-code-frame{background:var(--ds-surface);border:var(--ds-bw) solid var(--ds-border);border-radius:var(--ds-r);overflow:hidden}
.ds-code-frame__head{display:flex;gap:var(--ds-s3);justify-content:space-between;padding:6px 12px;font:var(--ds-fs-xs)/1.5 var(--ds-mono);color:var(--ds-muted);background:var(--ds-surface-2);border-bottom:var(--ds-bw) solid var(--ds-border)}
.ds-code{margin:0;padding:var(--ds-s3) var(--ds-s4);overflow-x:auto;font:var(--ds-fs-sm)/1.6 var(--ds-mono);background:var(--ds-surface-2);white-space:pre}
.ds-code code{background:none;padding:0}

.ds-callout{padding:var(--ds-s3) var(--ds-s4);background:var(--ds-tone-soft,var(--ds-surface-2));border-left:4px solid var(--ds-tone,var(--ds-border));border-radius:var(--ds-r);color:var(--ds-text)}
.ds-callout>strong:first-child{color:var(--ds-tone-text,var(--ds-text))}
.ds-callout>:last-child{margin-bottom:0}

/* badge: pending/finalizing/blocked print the chat renderer's emoji; action is deliberately ▶ (board green = success) */
.ds-badge{display:inline-flex;align-items:center;gap:.35em;padding:1px 10px;border-radius:var(--ds-r-pill);font:600 var(--ds-fs-xs)/1.6 var(--ds-font);white-space:nowrap;background:var(--ds-tone-soft,var(--ds-surface-2));color:var(--ds-tone-text,var(--ds-text));border:1px solid var(--ds-tone,var(--ds-border))}
.ds-badge.is-action::before{content:"\25B6\FE0E"}
.ds-badge.is-pending::before{content:"\1F7E0"}
.ds-badge.is-finalizing::before{content:"\1F535"}
.ds-badge.is-blocked::before{content:"\1F534"}
.ds-badge.is-done::before,.ds-badge.is-success::before{content:"\2713"}
.ds-badge.is-solid{background:var(--ds-tone,var(--ds-border));color:var(--ds-on-status);border-color:var(--ds-tone,var(--ds-border))}

.ds-btn{display:inline-flex;align-items:center;gap:.4em;padding:9px 16px;font:600 var(--ds-fs-sm)/1.2 var(--ds-font);color:var(--ds-surface);background:var(--ds-text);border:var(--ds-bw) solid var(--ds-text);border-radius:var(--ds-r);cursor:pointer;text-decoration:none}
.ds-btn:hover{opacity:.88}
.ds-btn--quiet{color:var(--ds-text);background:transparent;border-color:var(--ds-border)}
.ds-btn--quiet:hover{background:var(--ds-surface-2);opacity:1}

/* flow diagram (inline SVG): nodes take the same is-* tone classes */
.ds-flow{display:block;width:100%;height:auto;color:var(--ds-text);font:var(--ds-fs-sm) var(--ds-font)}
.ds-flow .n rect{rx:var(--ds-r);fill:var(--ds-tone-soft,var(--ds-surface-2));stroke:var(--ds-tone,var(--ds-border));stroke-width:1.5}
.ds-flow .n text{fill:var(--ds-text)}
.ds-flow .e{fill:none;stroke:var(--ds-muted);stroke-width:1.5}
.ds-flow .e.is-hot{stroke:var(--ds-brand);stroke-width:2.5}
.ds-flow .lbl{fill:var(--ds-muted);font-size:12px}
.ds-flow marker path{fill:var(--ds-muted)}

/* ============================================================
   Bearings board - the board-design stylesheet above (assets/board.css of the
   board-design skill) is inlined verbatim for portability; everything below is
   board chrome (fm-*, bb-*) built only on its --ds-* tokens.
   ============================================================ */
/* ---- fm-badge: the ds badge look, tones mapped onto the ds status roles ---- */
.fm-badge {
  display: inline-flex; align-items: center; gap: 0.35em;
  font: 600 var(--ds-fs-xs)/1.6 var(--ds-font); padding: 1px 10px; white-space: nowrap;
  border-radius: var(--ds-r-pill);
  background: var(--ds-tone-soft, var(--ds-surface-2)); color: var(--ds-tone-text, var(--ds-text));
  border: 1px solid var(--ds-tone, var(--ds-border));
}
.fm-badge--online  { --ds-tone: var(--ds-success); --ds-tone-soft: var(--ds-success-soft); --ds-tone-text: var(--ds-success-text); }
.fm-badge--warn    { --ds-tone: var(--ds-warning); --ds-tone-soft: var(--ds-warning-soft); --ds-tone-text: var(--ds-warning-text); }
.fm-badge--danger  { --ds-tone: var(--ds-danger); --ds-tone-soft: var(--ds-danger-soft); --ds-tone-text: var(--ds-danger-text); }
.fm-badge--info    { --ds-tone: var(--ds-info); --ds-tone-soft: var(--ds-info-soft); --ds-tone-text: var(--ds-info-text); }
.fm-badge--solid   { --ds-tone: var(--ds-action); --ds-tone-soft: var(--ds-action-soft); --ds-tone-text: var(--ds-action-text); }
.fm-badge--online::before { content: "\2713"; }
.fm-badge--danger::before { content: "\1F534"; }
.fm-badge--solid::before  { content: "\25B6\FE0E"; }

/* ---- fm-btn: the ds button ---- */
.fm-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4em;
  font: 600 var(--ds-fs-sm)/1.2 var(--ds-font); white-space: nowrap; cursor: pointer; text-decoration: none;
  color: var(--ds-surface); background: var(--ds-text); border: var(--ds-bw) solid var(--ds-text); border-radius: var(--ds-r);
}
.fm-btn:hover { opacity: 0.88; }
.fm-btn--sm { padding: 9px 16px; }
.fm-btn[disabled] { opacity: 0.5; cursor: not-allowed; }

/* ---- fm-card ---- */
.fm-card {
  background: var(--ds-surface); border: 1px solid var(--ds-border);
  border-radius: var(--ds-r-lg); box-shadow: var(--ds-shadow); overflow: hidden;
}
.fm-card--poster { border: 2px solid var(--ds-text); box-shadow: var(--ds-shadow); border-radius: var(--ds-r); }
.fm-card--warm { background: var(--ds-surface-2); }

/* ---- fm-sign (eyebrow section label) ---- */
.fm-sign {
  display: inline-flex; align-items: center; gap: 8px; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.08em; font-size: var(--ds-fs-xs);
  line-height: 1; white-space: nowrap;
}
.fm-sign--eyebrow { color: var(--ds-link); }
.fm-sign--muted { color: var(--ds-muted); }
.fm-sign svg { width: 14px; height: 14px; }
.fm-ico { width: 1.15em; height: 1.15em; flex: none; vertical-align: -0.18em; }

/* ============================================================
   Board chrome (bb-*) - built on the same tokens
   ============================================================ */
.bb-nav {
  background: var(--ds-accent); color: var(--ds-on-accent);
  border-bottom: 4px solid var(--ds-brand);
}
.bb-nav__inner {
  max-width: var(--ds-width); margin: 0 auto; padding: 0 28px; height: 64px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.bb-brand { display: inline-flex; align-items: center; gap: 12px; }
.bb-brand__disc {
  display: grid; place-items: center; width: 34px; height: 34px; flex: none;
  border-radius: 999px; background: var(--ds-on-accent); color: var(--ds-accent);
}
.bb-brand__disc svg { width: 60%; height: 60%; }
.bb-brand__wm { font-family: var(--ds-font); font-size: var(--ds-fs-xl); font-weight: var(--ds-h-weight); color: inherit; line-height: 1; }
.bb-meta-mono { font-family: var(--ds-mono); font-size: var(--ds-fs-xs); color: var(--ds-muted); white-space: nowrap; }

.bb-main {
  max-width: var(--ds-width); margin: 0 auto;
  padding: 26px 28px 72px; display: flex; flex-direction: column; gap: 22px;
}

/* stat strip */
.bb-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.bb-stat {
  display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; min-width: 0;
  background: var(--ds-surface-2); border: 1px solid var(--ds-border); border-radius: var(--ds-r);
}
.bb-stat--call { background: var(--ds-action-soft); border: 2px solid var(--ds-action); }
.bb-stat__num { font-family: var(--ds-mono); font-size: var(--ds-fs-xl); font-weight: 600; line-height: 1; color: var(--ds-text); }
.bb-stat--call .bb-stat__num { color: var(--ds-action-text); }
.bb-stat__label { font-family: var(--ds-mono); font-size: var(--ds-fs-xs); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ds-muted); }

.bb-section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.bb-section__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.bb-cols { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 22px; }

/* ---- Captain's Call: one card at a time, dealt off a visible stack ---- */
.bb-callwrap { display: flex; flex-direction: column; gap: 12px; }
/* extra top margin clears the pile edges that poke below the active card */
.bb-stacknav { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.bb-stacknav__count { flex: 1 1 auto; font-family: var(--ds-mono); font-size: var(--ds-fs-xs); color: var(--ds-muted); }
.bb-stacknav__btn {
  display: inline-grid; place-items: center; width: 34px; height: 34px; cursor: pointer;
  background: var(--ds-surface); color: var(--ds-text);
  border: 1.5px solid var(--ds-border); border-radius: var(--ds-r);
  transition: background 120ms, border-color 120ms;
}
.bb-stacknav__btn:hover { background: var(--ds-surface-2); border-color: var(--ds-muted); }
.bb-stacknav__btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.bb-stacknav__btn svg { width: 16px; height: 16px; }
/* the stack: a squared-up paper pile - solid card faces at slight opposing
   rotations, like dealt cards, not translucent offset rectangles. The pile
   thins as cards are answered: two edges, then one, then none on the last. */
.bb-call { position: relative; display: grid; }
.bb-call::before, .bb-call::after {
  content: ""; position: absolute; inset: 0; z-index: 0;
  background: var(--ds-surface); border: 2px solid var(--ds-border);
  border-radius: var(--ds-r); box-shadow: var(--ds-shadow);
}
.bb-call::before { transform: rotate(1.3deg) translate(4px, 5px); }
.bb-call::after  { transform: rotate(-1.1deg) translate(-3px, 9px); }
.bb-call--penult::after { display: none; }
.bb-call--last::before, .bb-call--last::after,
.bb-call--empty::before, .bb-call--empty::after { display: none; }
.bb-call > .bb-decision { grid-area: 1 / 1; z-index: 1; }
.bb-call > .bb-decision[hidden] { display: none; }
.bb-decision { display: flex; flex-direction: column; }
.bb-decision__pad { padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.bb-decision__top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bb-decision__repo { font-family: var(--ds-mono); font-size: var(--ds-fs-xs); color: var(--ds-muted); white-space: nowrap; }
.ds-board .bb-decision__title { margin: 0; font-size: var(--ds-fs-lg); font-weight: 800; color: var(--ds-text); line-height: 1.25; }
.ds-board .bb-decision__detail { margin: 0; font-size: var(--ds-fs-sm); color: var(--ds-muted); line-height: 1.45; }
/* about / decide / recommended - three scannable context rows */
.bb-ctx { display: flex; flex-direction: column; gap: 6px; }
.bb-ctx__row { display: grid; grid-template-columns: 78px minmax(0,1fr); gap: 8px; align-items: baseline; }
.bb-ctx__k { font-family: var(--ds-mono); font-size: var(--ds-fs-xs); letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--ds-muted); white-space: nowrap; }
.bb-ctx__v { font-size: var(--ds-fs-sm); color: var(--ds-muted); line-height: 1.4; min-width: 0; }
.bb-decision__link { font-family: var(--ds-mono); font-size: var(--ds-fs-xs); color: var(--ds-link); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.bb-decision__link:hover { text-decoration: underline; }
/* One rhythm owner: the answer form is a flex column with the same 12px gap as
   the card pad, and the foot rides margin-top:auto so every Queue answer button
   sits on the same baseline with identical breathing room. */
.bb-decision form { display: flex; flex-direction: column; gap: 12px; flex: 1 1 auto; }
.bb-opts { display: flex; flex-direction: column; gap: 7px; }
.bb-opt {
  display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; cursor: pointer;
  background: var(--ds-surface-2); border: 1.5px solid var(--ds-border);
  border-radius: var(--ds-r); transition: border-color 120ms, background 120ms;
}
.bb-opt:hover { border-color: var(--ds-muted); }
.bb-opt input { accent-color: var(--ds-text); margin-top: 3px; flex: none; }
.bb-opt__body { min-width: 0; flex: 1 1 auto; }
.bb-opt__label { display: block; font-size: var(--ds-fs-sm); font-weight: 700; color: var(--ds-text); line-height: 1.3; }
.bb-opt__hint { display: block; font-size: var(--ds-fs-xs); color: var(--ds-muted); line-height: 1.35; margin-top: 1px; }
.bb-opt__rec { flex: none; align-self: center; font-size: var(--ds-fs-xs); font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--ds-surface); background: var(--ds-text);
  border-radius: var(--ds-r-pill); padding: 3px 8px 2px; }
.bb-opt:has(input:checked) { border-color: var(--ds-text); box-shadow: inset 0 0 0 1px var(--ds-text); }
.bb-decision__foot { display: flex; align-items: center; gap: 10px; margin-top: auto; }
.bb-queued {
  display: none; align-items: center; gap: 6px;
  font-size: var(--ds-fs-xs); font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--ds-success-text); background: var(--ds-success-soft); border: 1.5px solid var(--ds-success);
  border-radius: var(--ds-r); padding: 5px 9px 4px;
}
.is-queued .bb-queued { display: inline-flex; }
.bb-limit { display: none; font-size: var(--ds-fs-xs); font-weight: 700; color: var(--ds-danger-text); }
.bb-limit.is-visible { display: inline; }
.bb-freeform { width: 100%; font-family: var(--ds-font); font-size: var(--ds-fs-sm); color: var(--ds-text);
  background: var(--ds-surface); border: 1.5px solid var(--ds-border); border-radius: var(--ds-r); padding: 8px 11px; }
.bb-freeform:focus { border-color: var(--ds-brand); }

/* ---- compact rows (Underway / Landed / Charted) ---- */
.bb-rows { display: flex; flex-direction: column; }
.bb-row {
  display: flex; align-items: center; gap: 12px; padding: 11px 18px;
  border-top: 1px solid var(--ds-border); min-width: 0;
}
.bb-row:first-child { border-top: none; }
.bb-row__main { min-width: 0; flex: 1 1 auto; }
.bb-row__title { font-size: var(--ds-fs-sm); font-weight: 700; color: var(--ds-text); line-height: 1.3;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bb-row__sub { font-size: var(--ds-fs-xs); color: var(--ds-muted); line-height: 1.3; margin-top: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bb-row__id { font-family: var(--ds-mono); font-size: var(--ds-fs-xs); color: var(--ds-muted); white-space: nowrap; }
.bb-row__pr { font-family: var(--ds-mono); font-size: var(--ds-fs-xs); font-weight: 600; color: var(--ds-link); white-space: nowrap; }
.bb-row__pr:hover { text-decoration: underline; }
.bb-row__check { width: 26px; height: 26px; border-radius: var(--ds-r); display: grid; place-items: center; flex: none;
  background: var(--ds-success-soft); color: var(--ds-success-text); border: 1.5px solid var(--ds-success); }
.bb-row__check svg { width: 15px; height: 15px; }
.bb-morechip {
  display: inline-flex; align-items: center; gap: 6px; margin: 10px 18px 12px;
  font-size: var(--ds-fs-xs); font-weight: 800; color: var(--ds-muted);
  border: 1.5px dashed var(--ds-muted); border-radius: var(--ds-r-pill); padding: 5px 12px; width: fit-content;
}
.bb-empty { padding: 18px; font-size: var(--ds-fs-sm); color: var(--ds-muted); }

/* ---- Charted Next dispatch picker ---- */
/* margin:0 kills the UA default checkbox margin so picker rows and spacer rows
   share one text left edge */
.bb-pick { accent-color: var(--ds-text); width: 16px; height: 16px; flex: none; cursor: pointer; margin: 0; }
.bb-pick-spacer { width: 16px; flex: none; }
.bb-dispatch {
  display: flex; align-items: center; gap: 12px; padding: 12px 18px;
  border-top: 1.5px solid var(--ds-border); background: var(--ds-surface-2);
}
.bb-dispatch__count { flex: 1 1 auto; font-size: var(--ds-fs-xs); font-weight: 800; color: var(--ds-muted);
  text-transform: uppercase; letter-spacing: 0.07em; }

.bb-foot { display: flex; justify-content: flex-end; border-top: 1px solid var(--ds-border); padding-top: 14px; }

@media (max-width: 900px) {
  .bb-cols { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="bb-nav">
  <div class="bb-nav__inner">
    <span class="bb-brand">
      <span class="bb-brand__disc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 6v16"/><path d="m19 13 2-1a9 9 0 0 1-18 0l2 1"/><path d="M9 11h6"/><circle cx="12" cy="4" r="2"/>
        </svg>
      </span>
      <span class="bb-brand__wm">bearings</span>
    </span>
  </div>
</header>

<main class="ds-board bb-main">

  <div class="bb-stats" id="bb-stats"></div>

  <div class="bb-cols">
  <section class="bb-section">
    <div class="bb-section__head">
      <span class="fm-sign fm-sign--eyebrow">
        <svg class="fm-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
        Captain's Call
      </span>
      <span class="fm-sign fm-sign--muted" id="bb-call-sub"></span>
    </div>
    <div class="bb-callwrap">
      <div class="bb-call" id="bb-call"></div>
      <!-- nav sits under the stack so the active card's top edge aligns with
           the Charted Next card across the row -->
      <div class="bb-stacknav">
        <span class="bb-stacknav__count" id="bb-stack-count">-</span>
        <button type="button" class="bb-stacknav__btn" id="bb-stack-prev" aria-label="Previous card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button type="button" class="bb-stacknav__btn" id="bb-stack-next" aria-label="Next card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </section>

  <section class="bb-section">
    <div class="bb-section__head">
      <span class="fm-sign fm-sign--eyebrow">
        <svg class="fm-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        Charted Next
      </span>
      <span class="fm-sign fm-sign--muted" id="bb-charted-sub"></span>
    </div>
    <div class="fm-card fm-card--warm">
      <div class="bb-rows" id="bb-charted"></div>
      <div class="bb-dispatch" id="bb-dispatch" hidden>
        <span class="bb-dispatch__count" id="bb-dispatch-count">nothing picked</span>
        <span class="bb-queued" id="bb-dispatch-queued">
          <svg class="fm-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          queued
        </span>
        <button type="button" class="fm-btn fm-btn--sm fm-btn--gold" id="bb-dispatch-btn">Queue dispatch order</button>
      </div>
    </div>
  </section>
  </div>

  <div class="bb-cols">
    <section class="bb-section">
      <div class="bb-section__head">
        <span class="fm-sign fm-sign--eyebrow">
          <svg class="fm-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10.189V14"/><path d="M12 2v3"/><path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-8.188-3.639a2 2 0 0 0-1.624 0L3 14a11.6 11.6 0 0 0 2.81 7.76"/><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1s1.2 1 2.5 1c2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg>
          Underway
        </span>
      </div>
      <div class="fm-card"><div class="bb-rows" id="bb-underway"></div></div>
    </section>

    <section class="bb-section">
      <div class="bb-section__head">
        <span class="fm-sign fm-sign--eyebrow">
          <svg class="fm-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>
          Recently Landed
        </span>
      </div>
      <div class="fm-card"><div class="bb-rows" id="bb-landed"></div></div>
    </section>
  </div>

  <footer class="bb-foot">
    <span class="bb-meta-mono" id="bb-provenance">-</span>
  </footer>

</main>

<!-- ONE SLOT. bin/fm-bearings-board.sh build injects the fresh
     fm-bearings-board.v1 payload in place of the placeholder below; everything
     above and below is the shipped template and is never regenerated per run. -->
<script id="bearings-data" type="application/json">
__FM_BEARINGS_BOARD_DATA__
</script>

<script>
(function () {
  "use strict";

  /* Fail closed: a board with unreadable or wrong-schema data says so plainly
     instead of rendering an empty page that looks like an empty fleet. */
  function renderBoardError(msg) {
    var main = document.querySelector(".bb-main");
    main.innerHTML = "";
    var card = document.createElement("div");
    card.className = "fm-card fm-card--poster bb-decision";
    var pad = document.createElement("div");
    pad.className = "bb-decision__pad";
    var h = document.createElement("h3");
    h.className = "bb-decision__title";
    h.textContent = "This board could not load";
    var d = document.createElement("p");
    d.className = "bb-decision__detail";
    d.textContent = msg + " - ask firstmate to rebuild the board.";
    pad.appendChild(h);
    pad.appendChild(d);
    card.appendChild(pad);
    main.appendChild(card);
  }

  var data;
  try {
    data = JSON.parse(document.getElementById("bearings-data").textContent);
  } catch (e) {
    renderBoardError("The board data is not valid JSON");
    return;
  }
  if (!data || data.schema !== "fm-bearings-board.v1") {
    renderBoardError("Unsupported board data schema: " + (data && data.schema ? data.schema : "(none)"));
    return;
  }
  var fleetLists = [data.captains_call, data.underway, data.landed, data.charted];
  var callItemsValid = Array.isArray(data.captains_call) && data.captains_call.every(function (item) {
    return item && typeof item === "object" &&
      typeof item.key === "string" && item.key.length > 0 &&
      typeof item.type === "string" && item.type.length > 0 &&
      typeof item.title === "string" && item.title.length > 0 &&
      Array.isArray(item.options);
  });
  if (!fleetLists.every(Array.isArray) || !callItemsValid) {
    renderBoardError("The board data does not have the required structure");
    return;
  }

  try {
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function badge(tone, text) { return el("span", "fm-badge fm-badge--" + tone, text); }
  /* Warnings ride the charted feed for layout only; they are alarms, not work,
     so every count of queued work excludes them. */
  function isWarning(t) { return t && t.kind === "warning"; }
  function chartedQueued(rows) { return (rows || []).filter(function (t) { return !isWarning(t); }); }
  /* Charted Next reads newest filed first, so the most recently filed upcoming
     work is at the top. ISO filed dates compare as text; a row with no
     comparable date keeps its payload order after every dated row. */
  function chartedOrder(rows) {
    var dated = [], undated = [];
    (rows || []).forEach(function (t) {
      if (t && typeof t.filed === "string" && t.filed) dated.push(t); else undated.push(t);
    });
    dated.sort(function (a, b) { return a.filed < b.filed ? 1 : (a.filed > b.filed ? -1 : 0); });
    return dated.concat(undated);
  }
  var chartedMoreQueued = data.charted_more || 0;
  var chartedMoreWarnings = data.charted_warning_more || 0;
  function utf8ByteLength(text) { return new TextEncoder().encode(text).length; }
  var CHECK_SVG = '<svg class="fm-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

  document.getElementById("bb-provenance").textContent = data.schema + " · " + data.generated;

  /* stat strip */
  var callTotal = data.captains_call.length;
  var stats = [
    { n: callTotal, l: "need you", call: true },
    { n: data.underway.length, l: "underway" },
    { n: data.landed.length, l: "landed recently" },
    { n: chartedQueued(data.charted).length + chartedMoreQueued, l: "charted next" }
  ];
  var strip = document.getElementById("bb-stats");
  stats.forEach(function (s) {
    var t = el("div", "bb-stat" + (s.call ? " bb-stat--call" : ""));
    t.appendChild(el("span", "bb-stat__num", String(s.n)));
    t.appendChild(el("span", "bb-stat__label", s.l));
    strip.appendChild(t);
  });
  document.getElementById("bb-call-sub").textContent =
    callTotal ? callTotal + " item" + (callTotal === 1 ? "" : "s") + " wait on you, captain" : "nothing needs you, captain";

  /* Captain's Call deck: every item renders as the same full card */
  var deck = document.getElementById("bb-call");
  function ctxRow(k, v, rec) {
    var row = el("div", "bb-ctx__row" + (rec ? " bb-ctx__row--rec" : ""));
    row.appendChild(el("span", "bb-ctx__k", k));
    row.appendChild(el("span", "bb-ctx__v", v));
    return row;
  }

  data.captains_call.forEach(function (item) {
    var card = el("div", "fm-card fm-card--poster bb-decision");
    var pad = el("div", "bb-decision__pad");

    var top = el("div", "bb-decision__top");
    if (item.type === "merge") {
      top.appendChild(badge("online", "checks green"));
      top.appendChild(badge(item.risk === "low" ? "neutral" : "warn", "risk " + item.risk));
    } else {
      top.appendChild(badge("solid", "decision"));
      top.appendChild(el("span", "bb-decision__repo", item.repo));
    }
    pad.appendChild(top);

    pad.appendChild(el("h3", "bb-decision__title", item.title));

    if (item.type === "merge") {
      if (item.detail) pad.appendChild(el("p", "bb-decision__detail", item.detail));
      if (item.pr_url) {
        var pr = el("a", "bb-decision__link", item.pr_url);
        pr.href = item.pr_url; pr.target = "_blank"; pr.rel = "noopener";
        pad.appendChild(pr);
      }
    } else {
      /* the rec marker on the option itself carries the recommendation */
      var ctx = el("div", "bb-ctx");
      if (item.about) ctx.appendChild(ctxRow("about", item.about));
      if (item.decide) ctx.appendChild(ctxRow("decide", item.decide));
      pad.appendChild(ctx);
    }

    var form = document.createElement("form");
    form.setAttribute("data-lavish-question", item.key);
    var opts = el("div", "bb-opts");
    item.options.forEach(function (o) {
      var lab = el("label", "bb-opt");
      var input = document.createElement("input");
      input.type = "radio"; input.name = "answer"; input.value = o.value;
      lab.appendChild(input);
      var body = el("span", "bb-opt__body");
      body.appendChild(el("span", "bb-opt__label", o.label));
      if (o.hint) body.appendChild(el("span", "bb-opt__hint", o.hint));
      lab.appendChild(body);
      if (item.recommend_value && o.value === item.recommend_value) {
        lab.appendChild(el("span", "bb-opt__rec", "rec"));
      }
      opts.appendChild(lab);
    });
    form.appendChild(opts);

    if (item.allow_freeform) {
      var ff = document.createElement("input");
      ff.type = "text"; ff.name = "note"; ff.className = "bb-freeform";
      ff.placeholder = item.freeform_hint || "or answer in your own words…";
      form.appendChild(ff);
    }

    var foot = el("div", "bb-decision__foot");
    var btn = el("button", "fm-btn fm-btn--sm " + (item.type === "merge" ? "fm-btn--gold" : "fm-btn--primary"), "Queue answer");
    btn.type = "submit";
    foot.appendChild(btn);
    var q = el("span", "bb-queued");
    q.innerHTML = CHECK_SVG + " queued";
    foot.appendChild(q);
    var answerLimit = el("span", "bb-limit");
    answerLimit.setAttribute("role", "alert");
    foot.appendChild(answerLimit);
    form.appendChild(foot);

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      answerLimit.classList.remove("is-visible");
      var fd = new FormData(form);
      var value = fd.get("answer");
      var note = (fd.get("note") || "").trim();
      var displayAnswer = value ? (note ? value + " - " + note : value) : note;
      if (!displayAnswer) return;
      if (utf8ByteLength(displayAnswer) > 512) {
        answerLimit.textContent = "Answer is too long to queue (512 bytes maximum).";
        answerLimit.classList.add("is-visible");
        return;
      }
      if (window.lavish && window.lavish.queuePrompt) {
        /* The versioned context keeps the selected option separate from its
           note, while close carries the composer-declared completion mode. */
        var ctxData = {
          schema: "fm-bearings-answer.v1",
          question: item.key,
          selection: value || "",
          note: note
        };
        if (item.close) ctxData.close = item.close;
        window.lavish.queuePrompt(
          "Captain's Call answer - " + item.title + ": " + displayAnswer,
          { tag: "choice", text: item.title + " -> " + displayAnswer, element: form,
            data: ctxData }
        );
      }
      card.classList.add("is-queued");
      /* deal the next card once this one is answered */
      setTimeout(function () { showCard(active < cards.length - 1 ? active + 1 : active); }, 450);
    });

    pad.appendChild(form);
    card.appendChild(pad);
    deck.appendChild(card);
  });

  /* stack navigation: one card at a time, dealt off the pile */
  var cards = Array.prototype.slice.call(deck.children);
  var active = 0;
  var stackCount = document.getElementById("bb-stack-count");
  var stackPrev = document.getElementById("bb-stack-prev");
  var stackNext = document.getElementById("bb-stack-next");
  var stackNav = stackCount.parentNode;
  function showCard(i) {
    active = Math.max(0, Math.min(cards.length - 1, i));
    cards.forEach(function (c, j) { c.hidden = j !== active; });
    var answered = deck.querySelectorAll(".is-queued").length;
    stackCount.textContent = "card " + (active + 1) + " of " + cards.length +
      (answered ? " · " + answered + " answered" : "");
    stackPrev.disabled = active === 0;
    stackNext.disabled = active === cards.length - 1;
    /* the pile thins as the deal approaches the bottom */
    deck.classList.toggle("bb-call--penult", active === cards.length - 2);
    deck.classList.toggle("bb-call--last", active === cards.length - 1);
  }
  if (cards.length) {
    stackPrev.addEventListener("click", function () { showCard(active - 1); });
    stackNext.addEventListener("click", function () { showCard(active + 1); });
    showCard(0);
  } else {
    deck.classList.add("bb-call--empty");
    deck.appendChild(el("div", "bb-empty", "Nothing needs your action right now."));
    stackNav.hidden = true;
  }

  /* Underway */
  var uw = document.getElementById("bb-underway");
  if (!data.underway.length) uw.appendChild(el("div", "bb-empty", "Nothing is underway."));
  data.underway.forEach(function (t) {
    var row = el("div", "bb-row");
    row.appendChild(badge(t.state === "working" ? "info" : "neutral", t.state));
    var main = el("div", "bb-row__main");
    /* the snapshot's durable name-or-id label leads the row so a scan says
       WHICH task this is; the run status keeps its place on the second line */
    main.appendChild(el("div", "bb-row__title", t.name));
    /* captain-facing rows name the repo; the internal task id shows only when
       no repo is known */
    main.appendChild(el("div", "bb-row__sub",
      t.doing + " · " + t.kind + " · " + (t.repo || t.id)));
    row.appendChild(main);
    uw.appendChild(row);
  });

  /* Landed */
  var ld = document.getElementById("bb-landed");
  if (!data.landed.length) ld.appendChild(el("div", "bb-empty", "No recent completions are in the current baseline."));
  data.landed.forEach(function (t) {
    var row = el("div", "bb-row");
    var chk = el("span", "bb-row__check");
    chk.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    row.appendChild(chk);
    var main = el("div", "bb-row__main");
    main.appendChild(el("div", "bb-row__title", t.what));
    main.appendChild(el("div", "bb-row__sub", (t.repo || t.id) + " · " + t.owner));
    row.appendChild(main);
    if (t.pr_url) {
      var a = el("a", "bb-row__pr", "#" + t.pr_url.split("/").pop());
      a.href = t.pr_url; a.title = t.pr_url; a.target = "_blank"; a.rel = "noopener";
      row.appendChild(a);
    }
    ld.appendChild(row);
  });

  /* Charted Next + dispatch picker */
  var ch = document.getElementById("bb-charted");
  var bar = document.getElementById("bb-dispatch");
  var barCount = document.getElementById("bb-dispatch-count");
  var barBtn = document.getElementById("bb-dispatch-btn");
  var anyPickable = false;

  function pickedIds() {
    return Array.prototype.map.call(ch.querySelectorAll(".bb-pick:checked"), function (c) { return c.value; });
  }
  function refreshBar(limitMessage) {
    var n = pickedIds().length;
    barCount.textContent = limitMessage || (n ? n + " picked for dispatch" : "pick queued work to dispatch");
    barBtn.disabled = !n;
  }

  if (!chartedQueued(data.charted).length && !chartedMoreQueued) {
    ch.appendChild(el("div", "bb-empty", "Nothing is queued."));
  }
  chartedOrder(data.charted).forEach(function (t) {
    var row = el("div", "bb-row");
    if (t.dispatchable && !isWarning(t)) {
      anyPickable = true;
      var pick = document.createElement("input");
      pick.type = "checkbox"; pick.className = "bb-pick"; pick.value = t.id;
      pick.setAttribute("aria-label", "Pick " + t.id + " for dispatch");
      pick.addEventListener("change", function () {
        if (pick.checked && utf8ByteLength(pickedIds().join(",")) > 512) {
          pick.checked = false;
          refreshBar("Selection limit reached (512 bytes maximum). ");
          return;
        }
        refreshBar();
      });
      row.appendChild(pick);
    } else {
      row.appendChild(el("span", "bb-pick-spacer"));
    }
    var main = el("div", "bb-row__main");
    main.appendChild(el("div", "bb-row__title", t.title));
    /* second line keeps the title uncrowded in the half-width column */
    var chSub = t.repo || t.id;
    main.appendChild(el("div", "bb-row__sub", t.reason ? t.reason + " · " + chSub : chSub));
    row.appendChild(main);
    if (isWarning(t)) row.appendChild(badge("danger", "needs repair"));
    else if (t.reason) row.appendChild(badge("warn", "waiting"));
    ch.appendChild(row);
  });
  var chartedShown = chartedQueued(data.charted).length;
  var chartedTotal = chartedShown + chartedMoreQueued;
  document.getElementById("bb-charted-sub").textContent =
    chartedMoreQueued ? "showing " + chartedShown + " of " + chartedTotal : "";
  if (chartedMoreQueued) {
    ch.appendChild(el("span", "bb-morechip", "+" + chartedMoreQueued + " more queued - ask firstmate for the full chart"));
  }
  if (chartedMoreWarnings) {
    ch.appendChild(el("span", "bb-morechip", "+" + chartedMoreWarnings + " more repair warning" + (chartedMoreWarnings === 1 ? "" : "s") + " - ask firstmate for the full chart"));
  }

  if (anyPickable) {
    bar.hidden = false;
    refreshBar();
    barBtn.addEventListener("click", function () {
      var ids = pickedIds();
      var dispatchAnswer = ids.join(",");
      if (!ids.length) return;
      if (utf8ByteLength(dispatchAnswer) > 512) {
        refreshBar("Selection is too long to queue (512 bytes maximum). ");
        return;
      }
      if (window.lavish && window.lavish.queuePrompt) {
        window.lavish.queuePrompt(
          "Dispatch order - start this queued work now: " + ids.join(", "),
          { tag: "choice", text: "Dispatch: " + ids.join(", "), element: bar,
            queueKey: "dispatch.charted",
            data: { question: "dispatch.charted", answer: dispatchAnswer } }
        );
      }
      bar.classList.add("is-queued");
    });
  }
  } catch (e) {
    renderBoardError("The board data could not be rendered");
  }
})();
</script>
</body>
</html>
